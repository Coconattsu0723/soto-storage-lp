<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="sotoは、大切なものを手放さず、今の暮らしに余白をつくる宅配型収納サービスです。"
    >
    <title>soto | 暮らしに余白をつくる宅配型収納サービス</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body id="top">
    <a class="skip-link" href="#main-content">本文へ移動</a>

    <header class="site-header">
      <div class="container site-header__inner">
        <a class="site-brand" href="#top" aria-label="soto ページ上部へ">
          <img
            src="assets/images/logo/soto_logo-primary.png"
            width="2128"
            height="739"
            alt="soto"
          >
        </a>

        <nav class="site-nav" aria-label="主要導線">
          <a class="site-nav__cta" href="#hero-action"><span class="font-en">BOX</span>を選んではじめる</a>
        </nav>
      </div>
    </header>

    <main id="main-content">
      <section class="hero" aria-labelledby="hero-title">
        <div class="container hero__inner">
          <div class="hero__intro">
            <p class="hero__category">宅配型収納サービス</p>
            <h1 id="hero-title" class="hero__title">
              収納を増やすより、<br>
              暮らせる場所を増やそう。
            </h1>
          </div>

          <figure class="hero__media">
            <img
              src="assets/images/photos/hero_main-living-space.png"
              width="1448"
              height="1086"
              alt="自然光が差し込む、ゆとりのあるリビングでくつろぐ二人"
              fetchpriority="high"
              decoding="async"
            >
          </figure>

          <div class="hero__body">
            <div class="hero__copy">
              <p>
                季節のものも、たまに使うものも、<br>
                大切だから手放したくないものも。
              </p>
              <p>
                sotoなら、箱に詰めて預けるだけ。<br>
                家の外にもうひとつの収納をつくって、<br>
                今の住まいを、もっと心地よく使えます。
              </p>
            </div>

            <a id="hero-action" class="button button--primary" href="#box-price">
              <span><span class="font-en">BOX</span>を選んではじめる</span>
              <span class="button__arrow" aria-hidden="true">→</span>
            </a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
